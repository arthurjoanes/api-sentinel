name: pf-api-sentinel-test
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: sentinel_test
      POSTGRES_USER: sentinel_test
      POSTGRES_PASSWORD: test-only
    tmpfs: [/var/lib/postgresql/data]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sentinel_test -d sentinel_test']
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7.4.5-alpine
    mem_limit: 64m
  tests:
    image: ${SENTINEL_TEST_IMAGE:-pf-api-sentinel:local}
    user: root
    working_dir: /app
    volumes: ['.:/app', '${SENTINEL_TEST_ARTIFACTS:-./artifacts}:/artifacts']
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinel_test:test-only@postgres/sentinel_test
      TEST_DATABASE_URL: postgresql+asyncpg://sentinel_test:test-only@postgres/sentinel_test
      TEST_REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src:/app
      UV_PROJECT_ENVIRONMENT: /opt/venv
    tmpfs: [/tmp]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    command: [python, -m, pytest, -q, tests, '--junitxml=/artifacts/tests.xml']
    mem_limit: 384m
