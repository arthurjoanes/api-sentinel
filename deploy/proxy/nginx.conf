worker_processes 1;
events { worker_connections 256; }
http {
  resolver 127.0.0.11 valid=3s ipv6=off;
  upstream sentinel {
    zone sentinel 64k;
    server api:8000 resolve max_fails=1 fail_timeout=2s;
    keepalive 16;
  }
  limit_conn_zone $server_name zone=entry:1m;
  log_format operational escape=json '{"timestamp":"$time_iso8601","status":$status,"request_time":$request_time,"upstream_status":"$upstream_status"}';
  access_log /dev/stdout operational;
  error_log /dev/stderr warn;
  server {
    listen 80;
    server_tokens off;
    client_max_body_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;
    client_header_timeout 3s;
    client_body_timeout 3s;
    keepalive_timeout 3s;
    limit_conn entry 64;
    limit_conn_status 503;
    error_page 400 = @bad_request;
    error_page 413 = @too_large;
    error_page 414 = /_sentinel_uri_large;
    error_page 494 = @headers_large;
    error_page 502 503 504 = @unavailable;
    location @bad_request {
      default_type application/problem+json;
      return 400 '{"type":"urn:api-sentinel:problem:proxy_request","title":"Requisição inválida no proxy.","status":400,"code":"proxy_request","request_id":"$request_id"}';
    }
    location @too_large {
      default_type application/problem+json;
      return 413 '{"type":"urn:api-sentinel:problem:body_too_large","title":"Corpo excede o limite.","status":413,"code":"body_too_large","request_id":"$request_id"}';
    }
    location @headers_large {
      default_type application/problem+json;
      return 431 '{"type":"urn:api-sentinel:problem:headers_too_large","title":"Headers excedem o limite.","status":431,"code":"headers_too_large","request_id":"$request_id"}';
    }
    location = /_sentinel_uri_large {
      internal;
      default_type application/problem+json;
      return 414 '{"type":"urn:api-sentinel:problem:request_target_too_large","title":"Endereço excede o limite.","status":414,"code":"request_target_too_large","request_id":"$request_id"}';
    }
    location @unavailable {
      default_type application/problem+json;
      add_header Retry-After 1 always;
      return 503 '{"type":"urn:api-sentinel:problem:proxy_unavailable","title":"Serviço indisponível no proxy.","status":503,"code":"proxy_unavailable","request_id":"$request_id"}';
    }
    location /internal/ {
      default_type application/problem+json;
      return 404 '{"type":"urn:api-sentinel:problem:not_found","title":"Rota indisponível.","status":404,"code":"not_found","request_id":"$request_id"}';
    }
    location / {
      proxy_pass http://sentinel;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream off;
      proxy_connect_timeout 300ms;
      proxy_read_timeout 3s;
      proxy_send_timeout 3s;
    }
  }
}
