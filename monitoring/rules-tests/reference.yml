rule_files:
  - "../rules/reference.yml"
evaluation_interval: "1m"
group_eval_order:
  - "sentinel-recording-reference"
  - "sentinel-alerts-reference"
tests:
  -
    name: "referência saudável por seis horas"
    interval: "1m"
    input_series:
      -
        series: "sentinel_probe_config_valid"
        values: "1x500"
      -
        series: "up{job=\"api\",instance=\"one\"}"
        values: "1x430"
      -
        series: "up{job=\"api\",instance=\"two\"}"
        values: "1x430"
      -
        series: "up{job=\"receiver\"}"
        values: "1x430"
      -
        series: "up{job=\"alertmanager\"}"
        values: "1x430"
      -
        series: "up{job=\"prometheus\"}"
        values: "1x430"
      -
        series: "sentinel_probe_success"
        values: "1x430"
      -
        series: "sentinel_expected_replicas"
        values: "2x430"
      -
        series: "sentinel_probe_last_run_timestamp_seconds"
        values: "0+60x430"
      -
        series: "sentinel_http_requests_total{route=\"/v1/stores/{store_id}/summary\",method=\"GET\",outcome=\"success\",traffic=\"business\",instance=\"one\"}"
        values: "0+50x430"
      -
        series: "sentinel_http_requests_total{route=\"/v1/stores/{store_id}/summary\",method=\"GET\",outcome=\"server_error\",traffic=\"business\",instance=\"one\"}"
        values: "0x430"
      -
        series: "sentinel_http_request_duration_seconds_count{route=\"/v1/stores/{store_id}/summary\",method=\"GET\",outcome=\"success\",traffic=\"business\"}"
        values: "0+50x430"
      -
        series: "sentinel_http_request_duration_seconds_bucket{route=\"/v1/stores/{store_id}/summary\",method=\"GET\",outcome=\"success\",traffic=\"business\",le=\"0.5\"}"
        values: "0+50x430"
      -
        series: "sentinel_admission_total{stage=\"tenant\",result=\"rejected\"}"
        values: "0x430"
      -
        series: "sentinel_requests_inflight{stage=\"tenant\"}"
        values: "0x430"
      -
        series: "sentinel_db_pool_timeouts_total{pool=\"data\"}"
        values: "0x430"
      -
        series: "sentinel_erp_circuit_open"
        values: "0x430"
    alert_rule_test:
      -
        eval_time: "6h"
        alertname: "SentinelUnavailable"
        exp_alerts: []
      -
        eval_time: "6h"
        alertname: "SentinelErrorBudgetBurn"
        exp_alerts: []
      -
        eval_time: "6h"
        alertname: "SentinelLatencyHigh"
        exp_alerts: []
      -
        eval_time: "6h"
        alertname: "SentinelSaturation"
        exp_alerts: []
      -
        eval_time: "6h"
        alertname: "SentinelReplicaLost"
        exp_alerts: []
      -
        eval_time: "6h"
        alertname: "SentinelTelemetryUnavailable"
        exp_alerts: []
      -
        eval_time: "6h"
        alertname: "SentinelERPUnavailable"
