name: API Sentinel — verificações

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_PROJECT: pf-api-sentinel-ci-test-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_PROJECT: pf-api-sentinel-ci-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Obter fontes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Python para os scripts portáveis
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Preparar artefatos e construir a imagem com lockfile
        run: |
          mkdir -p artifacts
          docker compose version
          docker build --tag pf-api-sentinel:local . 2>&1 | tee artifacts/build.log

      - name: Verificar vulnerabilidades da imagem da aplicação
        run: |
          mkdir -p .runtime/scan
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD/.runtime/scan:/reports" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --scanners vuln --ignorefile /dev/null --format json \
            --output /reports/runtime.json pf-api-sentinel:local
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.runtime/scan/runtime.json').read_text())
          assert report['SchemaVersion'] == 2
          assert report['Metadata']['ImageID']
          assert {'os-pkgs', 'lang-pkgs'} <= {item.get('Class') for item in report['Results']}
          fields = ('VulnerabilityID', 'PkgName', 'InstalledVersion', 'FixedVersion', 'Severity', 'PrimaryURL')
          targets = [{
              'Target': item['Target'], 'Class': item.get('Class'),
              'Vulnerabilities': [{key: finding.get(key) for key in fields}
                                  for finding in (item.get('Vulnerabilities') or [])]
          } for item in report['Results']]
          public = {'SchemaVersion': 2, 'Metadata': {key: report['Metadata'][key] for key in ('ImageID', 'OS')}, 'Results': targets}
          Path('artifacts/runtime-vulnerabilities.json').write_text(json.dumps(public, indent=2))
          blocked = [finding for item in targets for finding in item['Vulnerabilities'] if finding['Severity'] in ('HIGH', 'CRITICAL')]
          print(f'Blocking HIGH/CRITICAL findings: {len(blocked)}')
          raise SystemExit(bool(blocked))
          PY

      - name: Lint, formato e tipos
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp \
            --volume "$PWD:/app:ro" --workdir /app pf-api-sentinel:local \
            ruff check --no-cache .
          docker run --rm --network none --read-only --tmpfs /tmp \
            --volume "$PWD:/app:ro" --workdir /app pf-api-sentinel:local \
            ruff format --check --no-cache .
          docker run --rm --network none --read-only --tmpfs /tmp \
            --volume "$PWD:/app:ro" --workdir /app pf-api-sentinel:local \
            mypy --cache-dir=/tmp/mypy-cache

      - name: Validar regras, configurações e séries sintéticas
        run: python scripts/check_monitoring.py 2>&1 | tee artifacts/monitoring-checks.log

      - name: Testes unitários e integração com PostgreSQL e Redis isolados
        run: |
          docker compose -f compose.test.yml -p "$TEST_PROJECT" \
            up --abort-on-container-exit --exit-code-from tests tests \
            2>&1 | tee artifacts/isolated-tests.log

      - name: Preparar massa e credenciais exclusivas do smoke
        run: |
          docker compose -f compose.yml -p "$SMOKE_PROJECT" up -d --wait postgres redis
          docker compose -f compose.yml -p "$SMOKE_PROJECT" \
            run --rm -e REPLICAS=2 tools python scripts/bootstrap.py

      - name: Iniciar jornada real com proxy e duas réplicas
        run: |
          docker compose -f compose.yml -p "$SMOKE_PROJECT" --profile observability \
            up -d --wait --wait-timeout 90 --scale api=2
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8104/health/ready", timeout=3) as response:
                      if response.status == 200 and json.load(response) == {"status": "ready"}:
                          print("Prontidão confirmada pelo proxy real.")
                          break
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                  pass
              time.sleep(0.5)
          else:
              raise SystemExit("A jornada pelo proxy não ficou pronta em 90 segundos.")
          PY

      - name: Segurança e operações pelo proxy real
        run: |
          docker compose -f compose.yml -p "$SMOKE_PROJECT" run --rm \
            -e RUN_HTTP_TESTS=1 -e SENTINEL_EXPECTED_REPLICAS=2 \
            -e SENTINEL_BASE_URL=http://proxy \
            -e SENTINEL_CREDENTIALS_FILE=/secrets/demo.json \
            tools python -m pytest -q --tb=short tests/security tests/operations \
            --junitxml=/artifacts/http-tests.xml \
            2>&1 | tee artifacts/http-tests.log

      - name: Coletar diagnóstico, inclusive em caso de falha
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f compose.test.yml -p "$TEST_PROJECT" \
            logs --no-color --tail 150 > artifacts/test-services.log 2>&1 || true
          docker compose -f compose.yml -p "$SMOKE_PROJECT" --profile observability \
            logs --no-color --tail 150 > artifacts/smoke-services.log 2>&1 || true
          docker compose -f compose.yml -p "$SMOKE_PROJECT" --profile observability \
            ps --all > artifacts/smoke-containers.txt 2>&1 || true

      - name: Encerrar somente os projetos temporários desta execução
        if: always()
        run: |
          result=0
          docker compose -f compose.test.yml -p "$TEST_PROJECT" \
            down --volumes --remove-orphans || result=1
          docker compose -f compose.yml -p "$SMOKE_PROJECT" --profile observability --profile tools \
            down --volumes --remove-orphans || result=1
          exit "$result"

      - name: Preservar relatórios e diagnóstico
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
