title = "API Sentinel secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "SHA-256 source fingerprints in operational evidence"
condition = "AND"
regexTarget = "match"
paths = ['''^artifacts/problem-review/[^/]+/run\.json$''']
regexes = ['''(?:auth|test_auth_admission|test_openapi)\.py"\s*:\s*"[a-f0-9]{64}"''']

[[rules.allowlists]]
description = "Checksums of runtime files, without file contents"
condition = "AND"
regexTarget = "match"
paths = ['''^artifacts/problem-review/demo-refresh-[^/]+/refresh\.json$''']
regexes = ['''secret_files_sha256"\s*:\s*"[a-f0-9]{64} ''' ]

[[rules.allowlists]]
description = "Display label of the synthetic revocation credential, not its token"
condition = "AND"
regexTarget = "match"
paths = ['''^artifacts/problem-review/[^/]+/run\.json$''']
regexes = ['''credential_name"\s*:\s*"verification-[0-9]+"''']

[[rules.allowlists]]
description = "Four verified source SHA-256 values in the packaged-interface evidence"
condition = "AND"
regexTarget = "match"
paths = ['''^docs/evidence/interface-package\.json$''']
regexes = [
  '''auth\.py"\s*:\s*"0ef5bb11ef099cf2f1816a7a03defa21433807f8afc03f7b5b799f137d9e9cf4"''',
  '''test_auth_db\.py"\s*:\s*"d6373f5d410de7804eb7c37f8ea2cbd4d121991b296daa66d8ad2b8b72c1fe96"''',
  '''test_auth_admission\.py"\s*:\s*"2f8473e821632992535054f233202849dc7ab5f10257e124320e145493b96597"''',
  '''test_openapi\.py"\s*:\s*"d8fc1d250f701e27d72cd7987e39938a2b6e4b57fb1e4e570ac8640017b5aa54"''',
]
