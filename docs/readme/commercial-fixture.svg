  <title id="title">Fixture comercial: 8.500 mais 4.000 centavos, total de R$ 125,00</title>
  <desc id="desc">Loja 7, período comercial de primeiro de janeiro de 2026. O pedido 101 tem duas unidades de 2.500 centavos e uma de 3.500: 8.500 centavos. O pedido 102 tem uma unidade de 4.000 centavos. Total de quatro unidades em dois pedidos: 12.500 centavos, ou 125 reais. Ticket médio: 6.250 centavos, ou 62 reais e 50 centavos. Barras com origem zero e mesma escala em centavos. Dados sintéticos da fixture manual-sales.json; não são preços de mercado ou benchmark.</desc>
