# Applied only by scripts/review.py with a unique disposable Compose project.
services:
  api:
    image: pf-api-sentinel-review:local
    environment: {SENTINEL_ENV: test}
  erp:
    image: pf-api-sentinel-review:local
  tools:
    image: pf-api-sentinel-review:local
    environment: {SENTINEL_ENV: test}
    volumes: ['${SENTINEL_RUN_DIR:?Run directory required}:/artifacts']
  receiver:
    image: pf-api-sentinel-review:local
    ports: !override ['127.0.0.1::9184']
  proxy:
    ports: !override ['127.0.0.1::80']
  prometheus:
    ports: !override ['127.0.0.1::9090']
  alertmanager:
    ports: !override ['127.0.0.1::9093']
  grafana:
    ports: !override ['127.0.0.1::3000']
  jaeger:
    ports: !override ['127.0.0.1::16686']
  k6:
    environment: {SENTINEL_LAB: '1'}
    volumes: ['${SENTINEL_RUN_DIR:?Run directory required}:/artifacts']
