# Applied only by scripts/review.py with a unique disposable Compose project.
services:
  redis-init:
    image: ${SENTINEL_REVIEW_IMAGE:?Attempt image required}
  api:
    image: ${SENTINEL_REVIEW_IMAGE:?Attempt image required}
    environment:
      SENTINEL_ENV: test
      QUOTA_ALGORITHM: ${QUOTA_ALGORITHM:-fixed-window}
      QUOTA_BURST_CAPACITY: ${QUOTA_BURST_CAPACITY:-10}
  erp:
    image: ${SENTINEL_REVIEW_IMAGE:?Attempt image required}
  tools:
    image: ${SENTINEL_REVIEW_IMAGE:?Attempt image required}
    environment:
      SENTINEL_ENV: test
      SENTINEL_LAB_PROJECT: ${SENTINEL_LAB_PROJECT:?Attempt required}
    volumes: ['${SENTINEL_RUN_DIR:?Run directory required}:/artifacts', 'redis-credentials:/redis-credentials:ro']
  receiver:
    image: ${SENTINEL_REVIEW_IMAGE:?Attempt image required}
    ports: !override ['127.0.0.1::9184']
  proxy:
    image: ${SENTINEL_PROXY_IMAGE:?Attempt proxy image required}
    ports: !override ['127.0.0.1::80']
  prometheus:
    ports: !override ['127.0.0.1::9090']
  alertmanager:
    ports: !override ['127.0.0.1::9093']
  grafana:
    ports: !override ['127.0.0.1::3000']
  jaeger:
    ports: !override ['127.0.0.1::16686']
  k6:
    environment: {SENTINEL_LAB: '1'}
    volumes: ['${SENTINEL_RUN_DIR:?Run directory required}:/artifacts']
  contracts:
    image: ${SENTINEL_CONTRACTS_IMAGE:?Attempt contracts image required}
    profiles: [tools]
    user: root
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      HYPOTHESIS_STORAGE_DIRECTORY: /tmp/hypothesis
      SENTINEL_LAB_PROJECT: ${SENTINEL_LAB_PROJECT:?Attempt required}
    volumes: ['secrets:/secrets:ro', '${SENTINEL_RUN_DIR:?Run directory required}:/artifacts']
    mem_limit: 384m
    cpus: 0.75
    command: [python, scripts/verify_contracts.py]
